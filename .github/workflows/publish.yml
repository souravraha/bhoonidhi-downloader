name: publish

on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          manifest-file: pixi.toml
          locked: true
      - name: Lint + test
        run: pixi run check

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          manifest-file: pixi.toml
          locked: true
      - name: Build artifacts
        run: pixi run python -m build --no-isolation
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          manifest-file: pixi.toml
          locked: true
      - name: Publish to GitHub Packages (PyPI registry)
        env:
          TWINE_USERNAME: ${{ github.actor }}
          TWINE_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: pixi run twine upload --non-interactive --repository-url https://pypi.pkg.github.com/${{ github.repository }} dist/*
      - name: Create GitHub Release with artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          generate_release_notes: true
