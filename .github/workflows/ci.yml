name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          manifest-file: pixi.toml
          locked: true
      - name: Lint + test
        run: pixi run check
